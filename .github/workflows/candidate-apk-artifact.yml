# b515 CANDIDATE-ONLY (DO NOT MERGE / DO NOT RUN without Vivek's explicit signed-build approval).
#
# Builds ONE release-signed CANDIDATE APK (build type `candidate`: same applicationId com.marketradar.app, same release
# signing config, bundled hash-pinned MarketVivi runtime served on the production origin) and uploads it ONLY as a
# workflow artifact together with a provenance/checksum report.
#
# Deliberately absent: release.yml, GitHub releases, tags, Pages, commits/pushes, Supabase or any production service.
# The token is read-only (contents: read); artifact upload uses the runner's artifact service, not GITHUB_TOKEN.
#
# Execution note: GitHub only accepts workflow_dispatch for a workflow file that exists on the default branch (main).
# This file lives on the candidate branch for review only. Running it later needs a separate, explicitly authorised
# step (e.g. a reviewed commit of this file alone to main, or a reviewed equivalent), then one manual dispatch with
# the inputs below. Neither has been done.
name: Market Radar Candidate APK (artifact only)

on:
  workflow_dispatch:
    inputs:
      native_sha:
        description: 'Full 40-hex Marketapp commit of the reviewed candidate (descendant of 3768131f)'
        required: true
        type: string
      pwa_sha:
        description: 'Full 40-hex MarketVivi commit whose runtime is bundled (must equal the committed pin)'
        required: true
        type: string
      expected_version_code:
        description: 'versionCode agreed after checking the installed phone build'
        required: true
        default: '515'
        type: string
      expected_version_name:
        description: 'versionName in app/build.gradle.kts at native_sha'
        required: true
        default: '2.6.84'
        type: string
      expected_cert_sha256:
        description: 'SHA-256 of the existing release signing certificate (hex, colons optional)'
        required: true
        type: string
      confirm_candidate_artifact_only:
        description: 'Confirm: signed CANDIDATE APK as a workflow artifact only (no release, no tag, no Pages)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: marketradar-candidate-apk
  cancel-in-progress: false

jobs:
  candidate:
    if: ${{ inputs.confirm_candidate_artifact_only == true }}
    name: Signed candidate APK (artifact only)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Recommended gate: create this environment with Vivek as required reviewer BEFORE any dispatch.
    environment: candidate-apk
    env:
      NATIVE_SHA: ${{ inputs.native_sha }}
      PWA_SHA: ${{ inputs.pwa_sha }}
      EXPECTED_VERSION_CODE: ${{ inputs.expected_version_code }}
      EXPECTED_VERSION_NAME: ${{ inputs.expected_version_name }}
      EXPECTED_CERT_SHA256: ${{ inputs.expected_cert_sha256 }}
      ACCEPTED_NATIVE_BASE: 3768131f6329f2aeb2580f93aabcde6bfd64b140
      BUNDLE_DIR: app/build/generated/candidatePwa/assets/pwa_candidate
    steps:
      - name: Validate inputs (full SHAs, numeric versionCode, hex cert)
        run: |
          set -euo pipefail
          [[ "$NATIVE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "native_sha is not a full 40-hex SHA"; exit 1; }
          [[ "$PWA_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "pwa_sha is not a full 40-hex SHA"; exit 1; }
          [[ "$EXPECTED_VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "expected_version_code must be numeric"; exit 1; }
          [[ "$EXPECTED_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "expected_version_name must be x.y.z"; exit 1; }
          cert=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          [[ "$cert" =~ ^[0-9a-f]{64}$ ]] || { echo "expected_cert_sha256 must be 64 hex"; exit 1; }
          echo "EXPECTED_CERT=$cert" >> "$GITHUB_ENV"

      - name: Checkout Marketapp at the exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          ref: ${{ inputs.native_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout MarketVivi at the exact accepted SHA (read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          repository: vivekashokan007-cloud/MarketVivi
          ref: ${{ inputs.pwa_sha }}
          path: _marketvivi
          fetch-depth: 1
          persist-credentials: false

      - name: Prove pinned checkouts, ancestry and bundle pin
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NATIVE_SHA"
          test "$(git -C _marketvivi rev-parse HEAD)" = "$PWA_SHA"
          git merge-base --is-ancestor 3768131f6329f2aeb2580f93aabcde6bfd64b140 "$NATIVE_SHA"
          pin=$(python3 -c 'import json;print(json.load(open("app/src/candidate/pwa_expected_manifest.json"))["marketvivi_sha"])')
          test "$pin" = "$PWA_SHA" || { echo "committed pin $pin != pwa_sha"; exit 1; }
          echo "CANDIDATE_SOURCE native=$NATIVE_SHA pwa=$PWA_SHA accepted_native_base=$ACCEPTED_NATIVE_BASE"

      - name: Verify Android identity in source (same applicationId, no suffix, agreed version)
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.marketradar.app"' app/build.gradle.kts
          grep -Eq "^\s*versionCode = ${EXPECTED_VERSION_CODE}$" app/build.gradle.kts
          grep -Fq "versionName = \"${EXPECTED_VERSION_NAME}\"" app/build.gradle.kts
          ! grep -Eq 'applicationIdSuffix|versionNameSuffix|isDebuggable = true' app/build.gradle.kts
          grep -q 'create("candidate")' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3   # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407   # v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Stage + verify bundled PWA from git objects at the pinned SHA (build-time hash check 1/2)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/candidate_pwa -p 'test_*.py' -v
          python3 tools/candidate_pwa/stage_candidate_pwa.py --marketvivi-dir _marketvivi --out "$BUNDLE_DIR" --expect-sha "$PWA_SHA"
          ls -la "$BUNDLE_DIR"

      - name: PWA checks at the pinned SHA (syntax + complete suite against this native source)
        run: |
          set -euo pipefail
          cd _marketvivi
          node --check app.js
          shopt -s nullglob
          files=(test_*.mjs tests/test_*.mjs)
          test "${#files[@]}" -ge 20
          MARKETAPP_DIR="$GITHUB_WORKSPACE" node --test "${files[@]}" | tee /tmp/pwa_suite.log
          grep -q '^# fail 0' /tmp/pwa_suite.log

      - name: Native checks (Python safety suite, bridge facade, debug + candidate JVM unit suites)
        env:
          MARKETVIVI_DIR: ${{ github.workspace }}/_marketvivi
        run: |
          set -euo pipefail
          python3 -m compileall -q app/src/main/python tools
          PYTHONPATH=app/src/main/python python3 -m unittest discover -s app/src/main/python/tests -p 'test_*.py'
          node --test tools/bridge_facade/test_native_bridge_facade.mjs | tee /tmp/facade.log
          grep -q '^# fail 0' /tmp/facade.log
          ./gradlew :app:testDebugUnitTest :app:testCandidateUnitTest --stacktrace

      - name: Decode release keystore (runner temp, outside the workspace)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/candidate-release.jks"
          test -s "$RUNNER_TEMP/candidate-release.jks"

      - name: Assemble signed CANDIDATE APK (verifyCandidatePwaBundle runs first; build-time hash check 2/2)
        env:
          MR_SOURCE_HEAD: ${{ inputs.native_sha }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/candidate-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleCandidate --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/candidate-release.jks"

      - name: Verify APK signer, package, version and bundled bytes; write provenance
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mapfile -t apks < <(find app/build/outputs/apk -name '*.apk')
          test "${#apks[@]}" = 1 || { echo "expected exactly one APK, found ${#apks[@]}"; exit 1; }
          case "${apks[0]}" in app/build/outputs/apk/candidate/*) ;; *) echo "not a candidate output: ${apks[0]}"; exit 1;; esac
          mkdir -p out
          cp "${apks[0]}" out/MarketRadar-candidate.apk
          "$BT/apksigner" verify --verbose --print-certs out/MarketRadar-candidate.apk > out/apksigner.txt
          signers=$(grep -c 'certificate SHA-256 digest' out/apksigner.txt)
          test "$signers" = 1 || { echo "expected one signer, found $signers"; exit 1; }
          cert=$(grep -m1 'certificate SHA-256 digest' out/apksigner.txt | awk -F': ' '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          test "$cert" = "$EXPECTED_CERT" || { echo "signing certificate $cert != expected $EXPECTED_CERT"; exit 1; }
          "$BT/aapt2" dump badging out/MarketRadar-candidate.apk > out/badging.txt
          grep -q "^package: name='com.marketradar.app' versionCode='${EXPECTED_VERSION_CODE}' versionName='${EXPECTED_VERSION_NAME}'" out/badging.txt
          ! grep -q 'application-debuggable' out/badging.txt
          unzip -Z1 out/MarketRadar-candidate.apk | grep '^assets/pwa_candidate/' | sort > out/bundled_assets.txt
          printf '%s\n' api.js app.js candidate_manifest.json index.html log-viewer.js manifest.json style.css | sed 's#^#assets/pwa_candidate/#' > /tmp/want_assets.txt
          diff -u /tmp/want_assets.txt out/bundled_assets.txt
          python3 - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          pin_raw = open("app/src/candidate/pwa_expected_manifest.json", "rb").read()
          pin = json.loads(pin_raw)
          z = zipfile.ZipFile("out/MarketRadar-candidate.apk")
          assert z.read("assets/pwa_candidate/candidate_manifest.json") == pin_raw, "packaged manifest differs from pin"
          files = {}
          for name, want in sorted(pin["files"].items()):
              data = z.read("assets/pwa_candidate/" + name)
              got = hashlib.sha256(data).hexdigest()
              assert got == want["sha256"] and len(data) == want["bytes"], f"{name}: {got} != {want}"
              files[name] = {"sha256": got, "bytes": len(data)}
          apk_sha = hashlib.sha256(open("out/MarketRadar-candidate.apk", "rb").read()).hexdigest()
          cert = os.environ["EXPECTED_CERT"]
          prov = {
              "kind": "marketradar-candidate-apk", "candidate_only": True, "release_created": False, "tag_created": False,
              "pages_published": False, "application_id": "com.marketradar.app", "build_type": "candidate",
              "version_code": int(os.environ["EXPECTED_VERSION_CODE"]), "version_name": os.environ["EXPECTED_VERSION_NAME"],
              "native_sha": os.environ["NATIVE_SHA"], "pwa_sha": os.environ["PWA_SHA"],
              "accepted_native_base": os.environ["ACCEPTED_NATIVE_BASE"],
              "pwa_manifest_sha256": hashlib.sha256(pin_raw).hexdigest(), "pwa_files": files,
              "signing_cert_sha256": cert, "apk_sha256": apk_sha,
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflow_sha": os.environ["GITHUB_SHA"], "actor": os.environ["GITHUB_ACTOR"],
          }
          json.dump(prov, open("out/provenance.json", "w"), indent=1, sort_keys=True)
          print(json.dumps(prov, indent=1, sort_keys=True))
          PY
          ( cd out && sha256sum MarketRadar-candidate.apk provenance.json apksigner.txt badging.txt bundled_assets.txt > SHA256SUMS && sha256sum -c SHA256SUMS )
          git status --porcelain --untracked-files=no | tee /tmp/tracked_changes.txt
          test ! -s /tmp/tracked_changes.txt

      - name: Upload candidate artifact ONLY (APK + provenance + checksums)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: marketradar-candidate-${{ inputs.expected_version_code }}-${{ inputs.native_sha }}
          path: |
            out/MarketRadar-candidate.apk
            out/provenance.json
            out/apksigner.txt
            out/badging.txt
            out/bundled_assets.txt
            out/SHA256SUMS
          retention-days: 7
          if-no-files-found: error

      # Intentionally absent: release.yml, softprops/action-gh-release, gh release, tag pushes, Pages, commits/pushes,
      # Supabase/production calls. contents: read means the token cannot create any of them.
