name: Cloud recovery validation (no APK or deployment)
on:
  push:
    branches: ['codex/cloud-recovery-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres'
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: SDK
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          yes | sdkmanager --licenses >/dev/null
      - name: Compile native app and run complete JVM suite
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python recovery and existing state/position regressions
        run: |
          PYTHONPATH=app/src/main/python python -m unittest discover -s app/src/main/python/tests -p 'test_cloud_archive_v1.py'
          PYTHONPATH=app/src/main/python python -m unittest discover -s app/src/main/python/tests -p 'test_single_leg*.py'
          PYTHONPATH=app/src/main/python python -m unittest discover -s app/src/main/python/tests -p 'test_daily_review*.py'
      - name: Isolated PostgreSQL access/ownership/lease/commit tests
        env:
          CLOUD_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          CLOUD_SCRATCH_OK: '1'
        run: |
          pip install 'psycopg[binary]==3.2.13'
          python tools/cloud_recovery/test_database.py
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-recovery-test-results
          path: app/build/test-results/
