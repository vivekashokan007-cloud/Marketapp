name: Market Radar Review Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tools/**'
      - 'supabase/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/review-validation.yml'
  push:
    branches:
      - main
      - work/g8-g10-integrity-20260913
      - review/codex-corrective-20260914
      - work/db1-pc2-review-corrections-20260929
      - work/paper-implied-ev-v12-20261013
      - work/overnight-integrity-b507-20261015
    paths:
      - 'app/**'
      - 'tools/**'
      - 'supabase/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/review-validation.yml'

permissions:
  contents: read

concurrency:
  group: review-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-only:
    name: Python and Android unit tests (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # DB-1: a throwaway PostgreSQL matching production's major version (17),
    # used only by the scratch-database suite below. Nothing here reaches
    # Supabase.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout Marketapp
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Avoid the action's obsolete default `tools` package. API 35 and
          # build-tools are installed explicitly in the next step.
          packages: platform-tools

      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Verify generated lot-table source
        run: python3 scripts/generate_contract_lot_table_kt.py --check
      - name: M0 Stage 2 offline export verifier + B9 reproduction regressions
        run: |
          python3 -W error::ResourceWarning -m unittest discover -s tools/research_m0_export -p 'test_*.py' -v
          python3 tools/research_m0_export/Stage2B9Counterexamples.py --tool-dir tools/research_m0_export -v
      - name: CI-3 freeze verifier regressions + approved record + immutable protocol hash
        run: |
          python3 -m unittest discover -s tools/research_m0_freeze -p 'test_*.py' -v
          echo "cf65c2ada8f91da1f077836935eb6fbb15e78e39b8689bedbbae2679a4b74aa5  tools/research_m0_freeze/freeze_inputs/SPECIAL_SESSION_PROTOCOL_V1_20261023.md" | sha256sum -c
          echo "70274ccdab7aa1bdedaf50955a1f94552089238d95c46ad405725779fcefdec9  tools/research_m0_freeze/freeze_inputs/SPECIAL_SESSION_DECISION_RECORD_APPROVED_20261023.json" | sha256sum -c
          python3 -I tools/research_m0_freeze/freeze_inputs/verify_freeze_record_20261023.py tools/research_m0_freeze/freeze_inputs/SPECIAL_SESSION_PROTOCOL_V1_20261023.md tools/research_m0_freeze/freeze_inputs/SPECIAL_SESSION_DECISION_RECORD_APPROVED_20261023.json

      # Additive validation only; changes no gate, protection or permission. These 22 tests guard the candidate
      # packaging (committed PWA pin, staging determinism, the candidate workflow's own protections, and that every
      # hardcoded copy of the accepted pin agrees). They previously ran ONLY in the manually dispatched candidate
      # workflow, so a pin expectation left at a superseded commit stayed green here for weeks. Packaging guards
      # belong in the run that sees every push.
      - name: Candidate packaging guards (committed PWA pin, staging, pin-copy agreement)
        run: python3 -m unittest discover -s tools/candidate_pwa -p 'test_*.py' -v

      - name: Run complete Python safety suite
        run: |
          python3 -m compileall -q app/src/main/python tools
          PYTHONPATH=app/src/main/python python3 -m unittest discover \
            -s app/src/main/python/tests -p 'test_*.py'
          python3 -m unittest discover -s tools/direction_replay_v1 -p 'test_*.py' -v

      - name: Brain parity determinism (C5, repeated)
        run: |
          for i in 1 2 3; do
            PYTHONPATH=app/src/main/python:app/src/main/python/tests python3 -m unittest \
              test_ev_v12_integration.BrainAnalyze test_ev_v12_review_r3 test_ev_v12_review_r4
          done

      # b506 (Codex option A): execute the REAL injected window.NativeBridge facade (extracted from MainActivity.kt)
      # against an AndroidBridge spy (coverage 22/22 + forwarding contract + lifecycle), then the paired MarketVivi
      # PWA chain (AndroidBridge only -> real facade -> real app.js EV code).
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: EV bridge facade tests (real MainActivity wrapper source)
        run: |
          set -o pipefail
          node --test tools/bridge_facade/test_native_bridge_facade.mjs | tee /tmp/facade.log
          grep -q '22/22 ev methods exported by the real facade' /tmp/facade.log
          grep -q '22/22 ev methods correctly forwarded through the real facade' /tmp/facade.log
          grep -q '^# fail 0' /tmp/facade.log
          grep -q '^ok 6 - 6. b507 new bridge methods' /tmp/facade.log
          node --test tools/bridge_facade/test_m0_research_facade.mjs | tee /tmp/m0facade.log
          grep -q '^# pass 2' /tmp/m0facade.log
          grep -q '^# fail 0' /tmp/m0facade.log

      - name: Resolve paired MarketVivi ref
        id: pair
        run: |
          ref="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads https://github.com/vivekashokan007-cloud/MarketVivi.git "$ref" >/dev/null; then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout paired MarketVivi (read-only)
        uses: actions/checkout@v4
        with:
          repository: vivekashokan007-cloud/MarketVivi
          ref: ${{ steps.pair.outputs.ref }}
          path: _marketvivi
          persist-credentials: false

      - name: EV PWA chain through the real facade (AndroidBridge only)
        run: |
          set -o pipefail
          (cd _marketvivi && git rev-parse HEAD)
          MARKETAPP_DIR="$PWD" node --test _marketvivi/tests/test_ev_v12_bridge_chain_b506.mjs | tee /tmp/chain.log
          node --test tools/bridge_facade/test_m0_stage2_export_facade.mjs | tee /tmp/s2facade.log
          grep -q '^# fail 0' /tmp/s2facade.log
          MARKETAPP_DIR="$PWD" node --test _marketvivi/tests/test_m0_stage2_export_status.mjs | tee /tmp/s2card.log
          grep -q '^# fail 0' /tmp/s2card.log
          grep -q '^# pass 5' /tmp/chain.log
          grep -q '^# fail 0' /tmp/chain.log

      # b507 real overnight chain: native SessionInputs golden (JVM) -> Python brain stage -> PWA renderer
      - name: b507 overnight chain (Kotlin golden -> Python -> paired MarketVivi renderer)
        run: |
          set -o pipefail
          ./gradlew -q :app:testDebugUnitTest --tests 'com.marketradar.app.B507OvernightIntegrityTest'
          git diff --exit-code tools/b507_chain
          PYTHONPATH=app/src/main/python:app/src/main/python/tests python3 -m unittest \
            test_b507_real_chain test_overnight_integrity_b507
          git diff --exit-code tools/b507_chain
          MARKETAPP_DIR="$PWD" node --test _marketvivi/tests/test_b507_overnight_chain.mjs | tee /tmp/b507chain.log
          grep -q '^# pass 7' /tmp/b507chain.log
          grep -q '^# fail 0' /tmp/b507chain.log

      # G4 (sandbox corrections): exact Android infra-status outputs (golden) rendered by the paired MarketVivi app.js.
      - name: G4 PWA infra-status render (Android golden -> paired MarketVivi renderer)
        run: |
          set -o pipefail
          MARKETVIVI_DIR="$PWD/_marketvivi" node --test tools/sandbox_exec/test_g4_pwa_infra_render.mjs | tee /tmp/g4render.log
          grep -q '^# pass 4' /tmp/g4render.log
          grep -q '^# fail 0' /tmp/g4render.log

      - name: Run complete Android unit suite
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # The candidate source set was never compiled by any push-triggered run: the only workflow
      # that builds it is the manually dispatched candidate build, which has never run. That is
      # exactly why B515CandidateVariantTest sat two identity generations stale without failing
      # anything. This is test-only - no signing key, no APK, no release - and it pins the bundle
      # to the COMMITTED pin rather than a branch head, so it stays correct after the paired web
      # branch merges and main's SHA no longer equals the pinned commit.
      - name: Resolve the committed candidate PWA pin
        id: pin
        run: |
          sha=$(python3 -c 'import json; print(json.load(open("app/src/candidate/pwa_expected_manifest.json"))["marketvivi_sha"])')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "committed candidate PWA pin: $sha"

      - name: Checkout MarketVivi at the committed pin (read-only)
        uses: actions/checkout@v4
        with:
          repository: vivekashokan007-cloud/MarketVivi
          ref: ${{ steps.pin.outputs.sha }}
          path: _marketvivi_pin
          # Full history: the pinned commit may live on a review branch rather than main, and a
          # shallow fetch of a commit unreachable from the default branch fails.
          fetch-depth: 0
          persist-credentials: false

      - name: Candidate-variant JVM suite against the pinned bundle
        env:
          BUNDLE_DIR: app/build/generated/candidatePwa/assets/pwa_candidate
        run: |
          python3 tools/candidate_pwa/stage_candidate_pwa.py \
            --marketvivi-dir _marketvivi_pin --out "$BUNDLE_DIR" \
            --expect-sha "${{ steps.pin.outputs.sha }}"
          ls -la "$BUNDLE_DIR"
          # MARKETVIVI_DIR also switches B515CandidatePwaTest's real-bytes pin check from skipped
          # to executed, so the committed manifest is verified against the actual web bytes.
          MARKETVIVI_DIR="$PWD/_marketvivi_pin" ./gradlew :app:testCandidateUnitTest --stacktrace

      # Gradle prints only the exception class for a failed test, which makes a remote-only
      # diagnosis a guessing game — one failure cost several CI rounds of elimination before this
      # existed. The XML reports carry the actual assertion messages, so they are surfaced on
      # failure. This one prints diagnostics for a FAILED run rather than handing over evidence,
      # so it stays; the evidence files are collected as a proper artifact below.
      - name: Premium capture failing-test messages (review diagnostics)
        if: failure()
        run: |
          shopt -s nullglob
          for x in app/build/test-results/testDebugUnitTest/*.xml; do
            python3 - "$x" <<'PY'
          import sys, xml.etree.ElementTree as ET
          t = ET.parse(sys.argv[1]).getroot()
          for tc in t.iter('testcase'):
              for bad in list(tc.findall('failure')) + list(tc.findall('error')):
                  print('FAILED %s.%s' % (tc.get('classname'), tc.get('name')))
                  msg = (bad.get('message') or '').strip()
                  print('  message: %s' % msg[:2000])
                  body = (bad.text or '').strip().splitlines()
                  for line in body[:6]:
                      print('  %s' % line[:300])
                  print()
          PY
          done

      # Intentional artifact collection, replacing the review-only `cat` of these files into the
      # job log. The log dump was never a sound way to hand over evidence: a reviewer had to
      # reconstruct the JSON from timestamp-prefixed log lines and could then only state a digest
      # of their own reconstruction, with an explicit caveat about the original file's trailing
      # whitespace. CI now computes the digests on the real files and uploads the files
      # themselves, so the bytes a reviewer verifies are the bytes the producer wrote.
      - name: Premium capture evidence manifest
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -u
          out=app/build/premium_capture_evidence
          mkdir -p "$out"
          for f in app/build/premium_capture_measurements.txt \
                   app/build/premium_capture_resource_cost.txt \
                   app/build/premium_capture_acceptance_export.json; do
            if [ -f "$f" ]; then
              cp "$f" "$out/"
            else
              echo "absent: $f" >> "$out/ABSENT.txt"
            fi
          done
          ( cd "$out" && sha256sum ./* > SHA256SUMS 2>/dev/null || true )
          # The HEAD sha, not GITHUB_SHA. On a pull_request event GITHUB_SHA is the ephemeral
          # merge commit, which is not the head anyone reviews — labelling evidence with it
          # misattributes which commit produced it. Both are recorded so the distinction is
          # visible rather than implied.
          { echo "head: ${HEAD_SHA}";
            echo "github_sha_merge_ref: ${GITHUB_SHA}";
            echo "run: ${GITHUB_RUN_ID}";
            echo "produced_by: PremiumCaptureTest against the committed raw vendor fixture";
            echo "fixture: app/src/test/resources/contracts/x1_upstox_raw_chains.json";
            echo "not_a_device_measurement: true"; } > "$out/PROVENANCE.txt"
          cat "$out/PROVENANCE.txt"
          echo "--- digests, computed by CI on the producer's own files ---"
          cat "$out/SHA256SUMS" || true
          # The two SMALL measurement files are also echoed, with their digests above, so the
          # numbers can be read and quoted without downloading anything — and the digest lets a
          # reader confirm the printed text matches the file. The large acceptance JSON is
          # DELIBERATELY not echoed: reconstructing it from timestamp-prefixed log lines is what
          # made the previous handover unsound, and it belongs in the artifact only.
          for f in premium_capture_measurements.txt premium_capture_resource_cost.txt; do
            if [ -f "$out/$f" ]; then
              echo "--- BEGIN $f (digest above) ---"
              cat "$out/$f"
              echo "--- END $f ---"
            fi
          done

      - name: Upload premium capture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: premium-capture-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/premium_capture_evidence
          if-no-files-found: warn
          retention-days: 14

      - name: DB-1 migration suite and end-to-end parity audit (scratch PostgreSQL 17)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PC2_SCRATCH_OK: '1'
        run: tools/pc2_db_suite/run.sh

      - name: EV v1.2 scratch DB suite (migration + builder ACL follow-up, RLS, quotas, trade_uid index; baseline profile)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          EV_SCRATCH_OK: '1'
          EV_SUITE_PROFILE: baseline
        run: |
          set -o pipefail
          tools/ev_db_suite/run.sh | tee /tmp/ev_baseline.log
          grep -q 'follow-up applied (2)' /tmp/ev_baseline.log

      - name: EV v1.2 scratch DB suite (Supabase default-privilege profile; leak reproduction + correction)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          EV_SCRATCH_OK: '1'
          EV_SUITE_PROFILE: supabase
        run: |
          set -o pipefail
          tools/ev_db_suite/run.sh | tee /tmp/ev_supabase.log
          grep -q 'PASS  \[supabase\] original migration ALONE reproduces the leak' /tmp/ev_supabase.log
          grep -q 'PASS  \[supabase\] follow-up applied (2)' /tmp/ev_supabase.log

      - name: EV v1.2 PostgREST HTTP contract suite (scratch only)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          EV_SCRATCH_OK: '1'
          EV_REST_REQUIRED: '1'
        run: |
          set -o pipefail
          curl -fsSL -o /tmp/pgrst.tar.xz https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          tar -xJf /tmp/pgrst.tar.xz -C /tmp
          EV_SUITE_PROFILE=baseline EV_POSTGREST_BIN=/tmp/postgrest python3 tools/ev_db_suite/rest_suite.py
          EV_SUITE_PROFILE=supabase EV_POSTGREST_BIN=/tmp/postgrest python3 tools/ev_db_suite/rest_suite.py | tee /tmp/rest_supabase.log
          grep -q 'PASS  \[supabase\] REST ev_builder_seed as authenticated -> HTTP 403 42501' /tmp/rest_supabase.log
          EV_SUITE_PROFILE=baseline EV_POSTGREST_BIN=/tmp/postgrest python3 tools/ev_db_suite/seed_runner_suite.py
          EV_SUITE_PROFILE=supabase EV_POSTGREST_BIN=/tmp/postgrest python3 tools/ev_db_suite/seed_runner_suite.py

      - name: b511 S1a client DELETE containment suite (scratch PostgreSQL 17 + PostgREST; never production)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          S1A_SCRATCH_OK: '1'
          S1A_POSTGREST_BIN: /tmp/postgrest
        run: |
          set -o pipefail
          tools/s1a_db_suite/run.sh | tee /tmp/s1a.log
          grep -q '^PASS  REST contained: authenticated DELETE /trades_v2?id=eq.fx1 -> 403 42501 and row remains' /tmp/s1a.log
          grep -q ' checks, 0 failed$' /tmp/s1a.log

      - name: b512 generated-candidate replay vs live RLS shape (scratch PostgreSQL 17 + PostgREST; never production)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          CANDIDATE_SCRATCH_OK: '1'
          CANDIDATE_POSTGREST_BIN: /tmp/postgrest
        run: |
          set -o pipefail
          tools/candidate_replay_db_suite/run.sh | tee /tmp/candidate_replay.log
          grep -q '^PASS  live shape: repeating the SAME frozen cohort -> 401 42501' /tmp/candidate_replay.log
          grep -q '^PASS  committed golden equals this run' /tmp/candidate_replay.log
          grep -q ' checks, 0 failed$' /tmp/candidate_replay.log

      - name: M0 research collector scratch DB suites (new migration + calendar-derived audit; never production)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          RESEARCH_M0_SCRATCH_OK: '1'
        run: |
          set -o pipefail
          sha256sum supabase/migrations/20261022120000_research_m0_collector.sql docs/research_m0/C1X_CONTINUITY_AUDIT_CALENDAR_20261022.sql
          grep -q 'research_m0.ingest' supabase/migrations/20261022120000_research_m0_collector.sql
          python3 tools/research_m0_db_suite/suite.py | tee /tmp/m0_db.log
          grep -q '^ok rotating_device_keys_cannot_reset_global_caps' /tmp/m0_db.log
          grep -q '^ok concurrent_conflicting_submissions' /tmp/m0_db.log
          grep -q '^ok hostile_default_privilege_profile' /tmp/m0_db.log
          grep -q '^research_m0_db_suite: 11 cases passed' /tmp/m0_db.log
          python3 tools/research_m0_db_suite/audit_suite.py | tee /tmp/m0_audit.log
          grep -q '^audit_suite: calendar-derived audit OK' /tmp/m0_audit.log
          grep -q '^audit_suite: SPAN_SPECIAL_SESSION tagging OK' /tmp/m0_audit.log

      - name: Confirm publication artifacts were not built
        run: |
          test ! -d app/build/outputs/apk
          test ! -d app/build/outputs/bundle
