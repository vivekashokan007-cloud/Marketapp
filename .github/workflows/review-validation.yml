name: Market Radar Review Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tools/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/review-validation.yml'
  push:
    branches:
      - main
      - work/g8-g10-integrity-20260913
      - review/codex-corrective-20260914
    paths:
      - 'app/**'
      - 'tools/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/review-validation.yml'

permissions:
  contents: read

concurrency:
  group: review-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-only:
    name: Python and Android unit tests (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Marketapp
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Verify generated lot-table source
        run: python3 scripts/generate_contract_lot_table_kt.py --check

      - name: Run complete Python safety suite
        run: |
          python3 -m compileall -q app/src/main/python tools
          PYTHONPATH=app/src/main/python python3 -m unittest discover \
            -s app/src/main/python/tests -p 'test_*.py'

      - name: Run complete Android unit suite
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Confirm publication artifacts were not built
        run: |
          test ! -d app/build/outputs/apk
          test ! -d app/build/outputs/bundle
