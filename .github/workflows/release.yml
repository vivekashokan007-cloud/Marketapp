name: Market Radar Release

on:
  push:
    branches:
      - main
    paths:
      - 'app/build.gradle.kts'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Get Version Name
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "tag=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Market Radar v${{ env.VERSION_NAME }}
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          body: |
            ### Market Radar v${{ env.VERSION_NAME }}

            Automated release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
