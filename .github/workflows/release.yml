name: Market Radar Signed Release

on:
  push:
    branches:
      - main
    paths:
      - 'app/build.gradle.kts'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" > keystore.base64
          base64 -d keystore.base64 > keystore.jks
          rm keystore.base64

      - name: Run complete Python safety suite
        run: |
          python -m py_compile app/src/main/python/brain.py app/src/main/python/ml_temporal.py
          PYTHONPATH=app/src/main/python python -m unittest discover \
            -s app/src/main/python/tests -p 'test_*.py'

      - name: Unit tests (safety guards)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Signed APK
        run: ./gradlew :app:assembleRelease --stacktrace
        env:
          RELEASE_KEYSTORE_PATH: "${{ github.workspace }}/keystore.jks"
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Get Version Name
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "tag=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Market Radar v${{ env.VERSION_NAME }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          body: |
            ### Market Radar v${{ env.VERSION_NAME }}

            Automated signed release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
